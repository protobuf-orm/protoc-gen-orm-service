edition = "2023";

package apptest;

import "google/protobuf/timestamp.proto";
import "orm.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/protobuf-orm/protoc-gen-orm-service/internal/apptest";

message Tenant {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
  }];
  string alias = 4 [(orm.field) = {default: ""}];
  string name = 5 [(orm.field) = {default: ""}];
  map<string, string> labels = 7;

  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {add: {}, get: {}, patch: {}, erase: {}}
  };
}

// Preference asks for Apply and not for Patch: its labels are edited a key at
// a time, which a PatchRequest has no shape for, so it has no PatchRequest.
message Preference {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
  }];
  map<string, string> labels = 7;

  option (orm.message) = {
    rpc: {
      get: {}
      apply: {}
    }
  };
}
