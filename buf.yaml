version: v2
modules:
  - path: ./proto
deps:
  - buf.build/orm/orm
  # The generated Apply RPC carries a patch.Patch, so the generated .proto
  # imports patch/patch.proto. Its schema is not frozen yet, so this is pinned
  # by buf.lock rather than tracked.
  - buf.build/patch/patch
lint:
  use:
    - BASIC
    - STANDARD
  except:
    - ENUM_NO_ALLOW_ALIAS
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_SAME_DIRECTORY
  enum_zero_value_suffix: _UNSPECIFIED
  service_suffix: Service
